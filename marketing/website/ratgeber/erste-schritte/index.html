<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--beige:#f9f6f1;--beige-dark:#f0ebe3;--navy:#1a1a2e;--gold:#c9922a;
--gold-light:#d4a84a;--text:#3a3a3a;--text-light:#6b6b6b;
}
html{scroll-behavior:smooth}
body{
font-family:'Source Sans 3',sans-serif;
background:var(--beige);color:var(--navy);
line-height:1.7;font-weight:300;
-webkit-font-smoothing:antialiased;
}

/* HEADER */
.site-header{
padding:1.5rem 1.5rem 1rem;
display:flex;align-items:center;justify-content:space-between;
max-width:860px;margin:0 auto;
}
.back-link{
font-size:.85rem;color:var(--text-light);
text-decoration:none;display:flex;align-items:center;gap:.35rem;
transition:color .2s;
}
.back-link:hover{color:var(--gold)}
.logo-wrap{display:flex;align-items:center;gap:.4rem}
.logo-dot{
display:inline-block;width:9px;height:9px;
border-radius:50%;background:var(--gold);
animation:glow 3s ease-in-out infinite;
}
@keyframes glow{
0%,100%{opacity:.6;box-shadow:0 0 4px rgba(201,146,42,.3)}
50%{opacity:1;box-shadow:0 0 12px rgba(201,146,42,.5)}
}
.logo-text{
font-family:'Cormorant Garamond',serif;
font-size:1.2rem;font-weight:600;
letter-spacing:.08em;color:var(--navy);
text-decoration:none;
}

/* HERO */
.hero{
max-width:860px;margin:0 auto;
padding:2rem 1.5rem 1.5rem;
}
.article-label{
font-size:.75rem;color:var(--gold);
letter-spacing:.2em;text-transform:uppercase;
font-weight:600;margin-bottom:.75rem;
}
.hero h1{
font-family:'Cormorant Garamond',serif;
font-size:clamp(2rem,4vw,2.8rem);
font-weight:700;line-height:1.2;
color:var(--navy);margin-bottom:.75rem;
}
.hero-sub{
font-size:1.1rem;color:var(--text);
max-width:580px;margin-bottom:.75rem;
}
.hero-meta{
font-size:.8rem;color:var(--text-light);
}

/* CONTENT */
.content{max-width:860px;margin:0 auto;padding:0 1.5rem;}

/* PDF BANNER */
.pdf-banner{
background:var(--beige-dark);
border:1px solid rgba(201,146,42,.25);
border-radius:12px;
padding:1.25rem 1.5rem;
display:flex;align-items:center;justify-content:space-between;
gap:1rem;flex-wrap:wrap;
margin:1.5rem 0 2.5rem;
}
.pdf-banner p{
font-size:.95rem;color:var(--text);
}
.pdf-banner strong{color:var(--navy)}
.btn-pdf{
display:inline-flex;align-items:center;gap:.5rem;
background:var(--gold);color:white;
padding:.65rem 1.3rem;border-radius:8px;
font-size:.9rem;font-weight:600;
text-decoration:none;white-space:nowrap;
transition:background .2s,transform .2s;
font-family:'Source Sans 3',sans-serif;
}
.btn-pdf:hover{background:var(--gold-light);transform:translateY(-1px)}

/* SECTION HEADINGS */
.section-block{margin-bottom:3rem}
.section-label-small{
font-size:.75rem;color:var(--gold);
letter-spacing:.18em;text-transform:uppercase;
font-weight:600;margin-bottom:1rem;
}
.section-block h2{
font-family:'Cormorant Garamond',serif;
font-size:clamp(1.5rem,2.5vw,2rem);
font-weight:600;color:var(--navy);
margin-bottom:1.5rem;
border-bottom:1px solid rgba(201,146,42,.2);
padding-bottom:.5rem;
}

/* STEPS */
.step{
display:grid;
grid-template-columns:2.5rem 1fr;
gap:.75rem 1rem;
margin-bottom:1.75rem;
align-items:start;
}
.step-number{
width:2.5rem;height:2.5rem;
border-radius:50%;
background:linear-gradient(135deg,var(--gold),var(--gold-light));
color:white;font-weight:600;font-size:.95rem;
display:flex;align-items:center;justify-content:center;
flex-shrink:0;margin-top:.15rem;
}
.step-body h3{
font-family:'Cormorant Garamond',serif;
font-size:1.2rem;font-weight:600;
color:var(--navy);margin-bottom:.35rem;
}
.step-body p{font-size:.95rem;color:var(--text);line-height:1.7}

/* TIP BOX */
.tip-box{
background:white;border-left:3px solid var(--gold);
border-radius:0 8px 8px 0;
padding:.75rem 1rem;margin-top:.75rem;
font-size:.875rem;color:var(--text-light);
}
.tip-box strong{color:var(--navy);font-weight:600}

/* BEHOERDEN LIST */
.behoerden-list{
list-style:none;
display:grid;gap:.75rem;
margin-top:.5rem;
}
.behoerden-list li{
background:white;border-radius:8px;
padding:1rem 1.25rem;
border:1px solid rgba(201,146,42,.12);
font-size:.95rem;color:var(--text);
display:grid;grid-template-columns:1.5rem 1fr;gap:.5rem;
}
.behoerden-list li::before{
content:"✓";color:var(--gold);font-weight:700;
}
.behoerden-list li strong{color:var(--navy)}

/* RATGEBER CARDS */
.ratgeber-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:1rem;margin-top:1.5rem;
}
.ratgeber-card{
background:white;border-radius:12px;
padding:1.5rem;
border:1px solid rgba(201,146,42,.15);
position:relative;
}
.ratgeber-card .badge-soon{
display:inline-block;
font-size:.7rem;font-weight:600;
color:var(--gold);letter-spacing:.1em;text-transform:uppercase;
background:rgba(201,146,42,.1);
padding:.2rem .6rem;border-radius:2rem;
margin-bottom:.6rem;
}
.ratgeber-card h3{
font-family:'Cormorant Garamond',serif;
font-size:1.05rem;font-weight:600;
color:var(--navy);
}
.ratgeber-card p{
font-size:.85rem;color:var(--text-light);
margin-top:.35rem;line-height:1.5;
}

/* CTA SECTION */
.cta-section{
background:var(--navy);
padding:3.5rem 1.5rem;
text-align:center;
margin-top:3rem;
}
.cta-section .section-label{
color:var(--gold);font-size:.75rem;
letter-spacing:.2em;text-transform:uppercase;
font-weight:600;margin-bottom:.75rem;
}
.cta-section h2{
font-family:'Cormorant Garamond',serif;
font-size:clamp(1.5rem,3vw,2.2rem);
color:white;font-weight:600;
margin-bottom:.75rem;
}
.cta-section p{
color:rgba(255,255,255,.7);
font-size:1rem;max-width:480px;
margin:0 auto 2rem;
}
.signup-form{
display:flex;gap:.75rem;
max-width:460px;margin:0 auto;
flex-wrap:wrap;justify-content:center;
}
.signup-form input[type="email"]{
flex:1;min-width:240px;
padding:.85rem 1.2rem;
border:2px solid rgba(255,255,255,.15);
border-radius:8px;background:rgba(255,255,255,.08);
color:white;font-size:1rem;
font-family:'Source Sans 3',sans-serif;
outline:none;transition:border-color .3s;
}
.signup-form input[type="email"]::placeholder{color:rgba(255,255,255,.4)}
.signup-form input[type="email"]:focus{border-color:var(--gold)}
.signup-form button{
padding:.85rem 1.8rem;
background:var(--gold);color:white;
border:none;border-radius:8px;
font-size:1rem;font-weight:600;cursor:pointer;
font-family:'Source Sans 3',sans-serif;
transition:background .3s,transform .2s;
}
.signup-form button:hover{background:var(--gold-light);transform:translateY(-1px)}
.signup-privacy{
font-size:.75rem;color:rgba(255,255,255,.4);
margin-top:1rem;
}

/* FOOTER */
footer{
text-align:center;padding:2.5rem 1.5rem;
border-top:1px solid rgba(201,146,42,.15);
}
.footer-candle{font-size:1.5rem;margin-bottom:.5rem}
.footer-brand{
font-family:'Cormorant Garamond',serif;
font-size:1rem;color:var(--navy);
font-weight:600;letter-spacing:.05em;
}
.footer-sub{font-size:.8rem;color:var(--text-light);margin-top:.25rem}
.footer-mail{
font-size:.85rem;color:var(--gold);
text-decoration:none;margin-top:.5rem;display:inline-block;
}
.footer-mail:hover{text-decoration:underline}
.footer-links{margin-top:.75rem}
.footer-links a{
font-size:.8rem;color:var(--text-light);
text-decoration:none;margin:0 .5rem;
}
.footer-links a:hover{color:var(--gold)}

/* RESPONSIVE */
@media(max-width:600px){
.ratgeber-grid{grid-template-columns:1fr}
.pdf-banner{flex-direction:column;align-items:flex-start}
.signup-form{flex-direction:column;align-items:stretch}
.signup-form input[type="email"]{min-width:unset}
.site-header{flex-direction:row}
}
</style>
</head>
