<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ありがとうございます – NACHKLANG</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --beige:  #f9f6f1;
      --navy:   #1a1a2e;
      --gold:   #c9922a;
      --text:   #2c2c3a;
      --muted:  #6b6b7a;
      --white:  #ffffff;
      --border: rgba(26,26,46,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--beige);
      color: var(--text);
      font-size: 16px;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--beige);
      border-bottom: 1px solid var(--border);
      padding: 18px 5%;
      display: flex;
      align-items: center;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-dot { width: 10px; height: 10px; background: var(--gold); border-radius: 50%; }
    .logo-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem; font-weight: 600;
      color: var(--navy); letter-spacing: 0.08em; text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 5%;
    }

    .thanks-box {
      max-width: 560px;
      text-align: center;
    }

    .icon {
      width: 56px; height: 56px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px;
      font-size: 1.5rem;
    }

    .eyebrow {
      font-size: 0.76rem; font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--gold); margin-bottom: 16px;
    }

    h1 {
      font-family: 'Noto Sans JP', serif;
      font-size: clamp(1.7rem, 3.5vw, 2.3rem);
      font-weight: 600; line-height: 1.5;
      color: var(--navy); margin-bottom: 20px;
    }

    p {
      color: var(--muted);
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.9;
      margin-bottom: 14px;
    }

    .divider {
      width: 40px; height: 1px;
      background: var(--gold);
      margin: 32px auto;
      opacity: 0.4;
    }

    .back-link {
      display: inline-block;
      font-size: 0.86rem;
      color: var(--navy);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: border-color 0.2s;
    }
    .back-link:hover { border-color: var(--gold); color: var(--gold); }

    footer {
      text-align: center;
      padding: 24px 5%;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <div class="logo-dot"></div>
    <span class="logo-name">Nachklang</span>
  </a>
</header>

<main>
  <div class="thanks-box">
    <div class="icon">✓</div>
    <div class="eyebrow">登録が完了しました</div>
    <h1>ご登録ありがとうございます</h1>
    <p>
      メールアドレスを登録いたしました。Nachklangがご利用いただけるようになりましたら、
      ご連絡いたします。
    </p>
    <p>
      ご連絡は一度だけです。スパムメールはお送りしません。いつでも配信停止いただけます。
    </p>
    <div class="divider"></div>
    <a href="index.html" class="back-link">ホームに戻る</a>
  </div>
</main>

<footer>
  &copy; 2026 NACHKLANG &nbsp;·&nbsp;
  <a href="privacy.html" style="color: inherit;">プライバシー</a>
</footer>

</body>
</html>
